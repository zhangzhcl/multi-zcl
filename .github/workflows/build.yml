name: Build Multi-ZCL

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        include:
          - os: macos-latest
            platform: mac
            artifact_name: Multi-ZCL-mac
          - os: windows-latest
            platform: win
            artifact_name: Multi-ZCL-win

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python (for node-gyp)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Build Electron app
        run: npm run dist:${{ matrix.platform }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: List release directory
        shell: bash
        run: ls -lah release/ || echo "No release directory"

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p upload
          if [ "${{ matrix.platform }}" = "mac" ]; then
            find release -maxdepth 1 \( -name "*.dmg" -o -name "*.zip" \) -exec cp {} upload/ \;
          else
            find release -maxdepth 1 \( -name "*.exe" -o -name "*.zip" \) -exec cp {} upload/ \;
          fi
          echo "Collected files:"
          ls -lah upload/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: upload/
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: Multi-ZCL-mac
          path: artifacts/mac

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: Multi-ZCL-win
          path: artifacts/win

      - name: List all artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/mac/* artifacts/win/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
